      state-binary_sensor-smoke-on-color: "#cf6058"
      state-binary_sensor-sound-on-color: "#dda44f"
      state-binary_sensor-tamper-on-color: "#cf6058"

      state-calendar-active-color: "#819f8f"
      state-camera-active-color: "#819f8f"

      state-climate-auto-color: "#9dc45f"
      state-climate-cool-color: "#6fa8b8"
      state-climate-dry-color: "#dda44f"
      state-climate-fan_only-color: "#aec6b8"
      state-climate-heat-color: "#cf6058"
      state-climate-heat_cool-color: "#b78d78"

      state-cover-active-color: "#819f8f"
      state-device_tracker-active-color: "#9dc45f"
      state-device_tracker-home-color: "#9dc45f"
      state-device_tracker-not_home-color: "#5a6f66"
      state-fan-active-color: "#e8c063"
      state-group-active-color: "#819f8f"
