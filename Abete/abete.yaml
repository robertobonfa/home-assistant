      state-automation-active-color: "#819f8f"

      state-binary_sensor-active-color: "#819f8f"
      state-binary_sensor-battery-on-color: "#cf6058"
      state-binary_sensor-carbon_monoxide-on-color: "#cf6058"
      state-binary_sensor-gas-on-color: "#cf6058"
      state-binary_sensor-heat-on-color: "#cf6058"
