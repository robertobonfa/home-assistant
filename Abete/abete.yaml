      state-input_boolean-active-color: "#e8c063"

      state-light-active-color: "#e8c063"

      state-lock-jammed-color: "#cf6058"
      state-lock-locked-color: "#9dc45f"
      state-lock-locking-color: "#dda44f"
      state-lock-open-color: "#cf6058"
