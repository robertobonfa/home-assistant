      state-vacuum-active-color: "#819f8f"

      # ----------------------------------------------------------------
      #  Badge e label
      # ----------------------------------------------------------------
      label-badge-background-color: "#1d332d"
      label-badge-text-color: "#e7f0ea"
      label-badge-red: "#cf6058"
      label-badge-green: "#9dc45f"
