<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" preserveAspectRatio="xMidYMid slice">
  <title>Uva — sfondo minimale / minimal background</title>
  <desc>Palette Uva: #1e0a24 #3c1450 #5e2382 #8236b5 #a855d8 #c77dff #e0aaff #f6ebff</desc>

  <defs>
    <!-- Cielo: dal verde-antracite piu profondo verso S1 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0920"/>
      <stop offset="45%"  stop-color="#1e0a24"/>
      <stop offset="100%" stop-color="#331143"/>
    </linearGradient>

    <!-- Alone uva in alto a destra -->
    <radialGradient id="glow" cx="0.74" cy="0.16" r="0.78">
      <stop offset="0%"   stop-color="#8236b5" stop-opacity="0.30"/>
      <stop offset="50%"  stop-color="#8236b5" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#8236b5" stop-opacity="0"/>
    </radialGradient>

    <!-- Contro-alone in basso a sinistra -->
    <radialGradient id="counterglow" cx="0.14" cy="0.92" r="0.55">
      <stop offset="0%"   stop-color="#a855d8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a855d8" stop-opacity="0"/>
    </radialGradient>

    <!-- Massa dell'orizzonte -->
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#321041"/>
      <stop offset="100%" stop-color="#2c0e38"/>
    </linearGradient>

    <!-- Vignettatura ai bordi, per non disturbare le card -->
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="55%"  stop-color="#140617" stop-opacity="0"/>
      <stop offset="100%" stop-color="#140617" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#sky)"/>
  <rect width="2560" height="1440" fill="url(#glow)"/>
  <rect width="2560" height="1440" fill="url(#counterglow)"/>

  <!-- Orizzonte curvo: ellisse molto larga, appena accennata -->
  <ellipse cx="1280" cy="3220" rx="3400" ry="2200" fill="url(#horizon)"/>
  <ellipse cx="1280" cy="3220" rx="3400" ry="2200" fill="none"
           stroke="#5e2382" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Secondo crinale, piu basso e piu chiaro -->
  <ellipse cx="1280" cy="3560" rx="3000" ry="2260" fill="#361247" fill-opacity="0.55"/>
  <ellipse cx="1280" cy="3560" rx="3000" ry="2260" fill="none"
           stroke="#5e2382" stroke-opacity="0.35" stroke-width="2"/>

  <rect width="2560" height="1440" fill="url(#vignette)"/>
</svg>
