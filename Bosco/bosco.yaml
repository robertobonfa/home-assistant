      state-calendar-active-color: "#74c69d"
      state-camera-active-color: "#74c69d"

      state-climate-auto-color: "#a3d977"
      state-climate-cool-color: "#6fb3c9"
      state-climate-dry-color: "#e6a23c"
      state-climate-fan_only-color: "#b7e4c7"
