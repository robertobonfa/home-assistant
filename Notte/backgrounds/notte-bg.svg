<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" preserveAspectRatio="xMidYMid slice">
  <title>Notte — sfondo minimale / minimal background</title>
  <desc>Palette Notte: #0b0d21 #151a3d #232a63 #3a4494 #5a6ac9 #8b9ae8 #c3ccf7 #f0f3ff</desc>

  <defs>
    <!-- Cielo: dal verde-antracite piu profondo verso S1 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0b1d"/>
      <stop offset="45%"  stop-color="#0b0d21"/>
      <stop offset="100%" stop-color="#121635"/>
    </linearGradient>

    <!-- Alone notte in alto a destra -->
    <radialGradient id="glow" cx="0.74" cy="0.16" r="0.78">
      <stop offset="0%"   stop-color="#3a4494" stop-opacity="0.30"/>
      <stop offset="50%"  stop-color="#3a4494" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#3a4494" stop-opacity="0"/>
    </radialGradient>

    <!-- Contro-alone in basso a sinistra -->
    <radialGradient id="counterglow" cx="0.14" cy="0.92" r="0.55">
      <stop offset="0%"   stop-color="#5a6ac9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5a6ac9" stop-opacity="0"/>
    </radialGradient>

    <!-- Massa dell'orizzonte -->
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#121533"/>
      <stop offset="100%" stop-color="#10132e"/>
    </linearGradient>

    <!-- Vignettatura ai bordi, per non disturbare le card -->
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="55%"  stop-color="#070815" stop-opacity="0"/>
      <stop offset="100%" stop-color="#070815" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#sky)"/>
  <rect width="2560" height="1440" fill="url(#glow)"/>
  <rect width="2560" height="1440" fill="url(#counterglow)"/>

  <!-- Orizzonte curvo: ellisse molto larga, appena accennata -->
  <ellipse cx="1280" cy="3220" rx="3400" ry="2200" fill="url(#horizon)"/>
  <ellipse cx="1280" cy="3220" rx="3400" ry="2200" fill="none"
           stroke="#232a63" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Secondo crinale, piu basso e piu chiaro -->
  <ellipse cx="1280" cy="3560" rx="3000" ry="2260" fill="#131737" fill-opacity="0.55"/>
  <ellipse cx="1280" cy="3560" rx="3000" ry="2260" fill="none"
           stroke="#232a63" stroke-opacity="0.35" stroke-width="2"/>

  <rect width="2560" height="1440" fill="url(#vignette)"/>
</svg>
