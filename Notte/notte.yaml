      state-alarm_control_panel-disarming-color: "#edb54b"
      state-alarm_control_panel-pending-color: "#edb54b"
      state-alarm_control_panel-triggered-color: "#e5556a"

      state-alert-off-color: "#5a6076"
      state-alert-on-color: "#e5556a"

      state-automation-active-color: "#8b9ae8"

      state-binary_sensor-active-color: "#8b9ae8"
      state-binary_sensor-battery-on-color: "#e5556a"
      state-binary_sensor-carbon_monoxide-on-color: "#e5556a"
      state-binary_sensor-gas-on-color: "#e5556a"
      state-binary_sensor-heat-on-color: "#e5556a"
      state-binary_sensor-moisture-on-color: "#e5556a"
      state-binary_sensor-problem-on-color: "#e5556a"
      state-binary_sensor-safety-on-color: "#e5556a"
      state-binary_sensor-smoke-on-color: "#e5556a"
      state-binary_sensor-sound-on-color: "#edb54b"
      state-binary_sensor-tamper-on-color: "#e5556a"

      state-calendar-active-color: "#8b9ae8"
      state-camera-active-color: "#8b9ae8"

      state-climate-auto-color: "#5cc99a"
      state-climate-cool-color: "#7fb9d6"
      state-climate-dry-color: "#edb54b"
      state-climate-fan_only-color: "#c3ccf7"
      state-climate-heat-color: "#e5556a"
      state-climate-heat_cool-color: "#b98ac9"

      state-cover-active-color: "#8b9ae8"
      state-device_tracker-active-color: "#5cc99a"
      state-device_tracker-home-color: "#5cc99a"
      state-device_tracker-not_home-color: "#5a6076"
      state-fan-active-color: "#8b9ae8"
      state-group-active-color: "#8b9ae8"
      state-humidifier-active-color: "#8b9ae8"
      state-input_boolean-active-color: "#8b9ae8"

      state-light-active-color: "#f2d16b"

      state-lock-jammed-color: "#e5556a"
      state-lock-locked-color: "#5cc99a"
      state-lock-locking-color: "#edb54b"
      state-lock-open-color: "#e5556a"
      state-lock-opening-color: "#edb54b"
