      state-vacuum-active-color: "#8b9ae8"

      # ----------------------------------------------------------------
      #  Badge e label
      # ----------------------------------------------------------------
      label-badge-background-color: "#151a3d"
      label-badge-text-color: "#f0f3ff"
      label-badge-red: "#e5556a"
      label-badge-green: "#5cc99a"
