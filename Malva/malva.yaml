      state-update-active-color: "#ddaa55"
      state-update-installing-color: "#c19fae"
      state-update-off-color: "#7a6a72"

      state-vacuum-active-color: "#c19fae"

      # ----------------------------------------------------------------
      #  Badge e label
      # ----------------------------------------------------------------
      label-badge-background-color: "#493344"
      label-badge-text-color: "#f7edef"
      label-badge-red: "#d94452"
      label-badge-green: "#74b285"
      label-badge-blue: "#a67f95"
      label-badge-yellow: "#ddaa55"
      label-badge-grey: "#684a5f"
