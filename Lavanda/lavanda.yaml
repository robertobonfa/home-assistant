      state-update-active-color: "#e8b44c"
      state-update-installing-color: "#be95c4"
      state-update-off-color: "#6f6684"

      state-vacuum-active-color: "#be95c4"

      # ----------------------------------------------------------------
      #  Badge e label
      # ----------------------------------------------------------------
      label-badge-background-color: "#3d2c66"
      label-badge-text-color: "#f7e8f0"
      label-badge-red: "#e04f5f"
      label-badge-green: "#7fc09a"
      label-badge-blue: "#9f86c0"
